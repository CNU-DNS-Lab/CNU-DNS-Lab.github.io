- title: Digital Agriculture
  subtitle: AI for smart digital Agriculture systems
  description: This project focuses on utilizing AI models for the improvement of digital agriculture systems, by reducing loss of crops and increasing yield. Currently we focus on systems for the early identification of plant diseases in field through plant leaf disease identification DL computer vision models.
  tags:
    - Digital-Agriculture
    
- title: Fed Med (ITRC)
  subtitle: Federated Learning AI for the medical field.
  description: Privacy-preserving distributed learning framework. Research on a privacy-preserving distributed learning framework based on federated learning.
  tags:
    - Fed-Med

- title: DNS-Based DID Resolution (KISA)
  subtitle: Decentralized Identifier Resolution basde on DNS
  description: Research on DNS-based resolution to support CRUD operations across diverse DID methods without relying on the centralized Universal Resolver.
  tags:
    - DID
    
- title: GITRC – Mobility AI
  subtitle: AI for smart digital Agriculture systems
  description: Mobility intelligence for networks using AI. Research on AI-driven vehicle traffic flow optimization and inter-vehicle communication protocols.
  tags:
    - GITRC
    
- title: SLAM
  subtitle: Simultaneous Localization and Mapping indoor system
  description: Point cloud processing, localization, and map generation. Research on path planning using 2D and 3D LiDAR and point cloud data.
  tags:
    - SLAM

- title: Glocal LAB – AI + Military
